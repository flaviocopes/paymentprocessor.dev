name: Editorial freshness review

on:
  schedule:
    - cron: "15 8 1 * *"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run editorial-review
      - run: npm run validate
